name: FDM v2 CP5 immutable toolchain

on:
  pull_request:
    paths:
      - "Dockerfile.toolchain"
      - "Dockerfile.authority"
      - "fdm-toolchain.lock.json"
      - "app/fdm_toolchain_provenance.py"
      - "tests/test_fdm_toolchain_provenance.py"
      - ".github/workflows/cp5-immutable-toolchain.yml"
      - "requirements.txt"
      - "app/**"
      - "profiles/**"
  push:
    branches:
      - main
      - "chris/fdm-v2-cp5-immutable-toolchain"
    paths:
      - "Dockerfile.toolchain"
      - "Dockerfile.authority"
      - "fdm-toolchain.lock.json"
      - "app/fdm_toolchain_provenance.py"
      - "tests/test_fdm_toolchain_provenance.py"
      - ".github/workflows/cp5-immutable-toolchain.yml"
      - "requirements.txt"
      - "app/**"
      - "profiles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build pinned FDM toolchain candidate
        run: docker build -f Dockerfile.toolchain -t workpiece-fdm-toolchain:candidate .

      - name: Extract and validate exact toolchain evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp5-evidence
          container_id=$(docker create workpiece-fdm-toolchain:candidate)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/opt/workpiece-toolchain/manifest.json" /tmp/cp5-evidence/toolchain-manifest.json
          docker cp "$container_id:/opt/workpiece-toolchain/packages.txt" /tmp/cp5-evidence/packages.txt
          docker cp "$container_id:/opt/orca/squashfs-root/AppRun" /tmp/cp5-evidence/orca-AppRun
          docker rm "$container_id"
          trap - EXIT

          docker image inspect --format '{{.Id}}' workpiece-fdm-toolchain:candidate | tee /tmp/cp5-evidence/toolchain-image-id.txt
          test "$(docker image inspect --format '{{.Architecture}}' workpiece-fdm-toolchain:candidate)" = "amd64"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from app.fdm_toolchain_provenance import validate_toolchain_lock, validate_toolchain_manifest

          lock_bytes = Path('fdm-toolchain.lock.json').read_bytes()
          manifest_bytes = Path('/tmp/cp5-evidence/toolchain-manifest.json').read_bytes()
          runtime_bytes = Path('/tmp/cp5-evidence/orca-AppRun').read_bytes()
          lock = validate_toolchain_lock(lock_bytes)
          manifest = validate_toolchain_manifest(
              lock_bytes=lock_bytes,
              manifest_bytes=manifest_bytes,
              orca_runtime_bytes=runtime_bytes,
          )
          assert lock['status'] == 'unpublished'
          assert manifest['orca_version'] == '2.4.2'
          assert manifest['orca_runtime_sha256'] == hashlib.sha256(runtime_bytes).hexdigest()
          assert manifest['packages_sha256'] == hashlib.sha256(Path('/tmp/cp5-evidence/packages.txt').read_bytes()).hexdigest()
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build parallel authority service candidate
        run: |
          docker build \
            -f Dockerfile.authority \
            --build-arg TOOLCHAIN_IMAGE=workpiece-fdm-toolchain:candidate \
            -t workpiece-fdm-authority:candidate \
            .
          docker image inspect --format '{{.Id}}' workpiece-fdm-authority:candidate | tee /tmp/cp5-evidence/runtime-image-id.txt
          test "$(docker image inspect --format '{{.Architecture}}' workpiece-fdm-authority:candidate)" = "amd64"

      - name: Record candidate-only CP5 provenance
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.fdm_toolchain_provenance import build_toolchain_provenance

          def local_ref(name: str, path: str) -> str:
              image_id = Path(path).read_text(encoding='utf-8').strip().lower()
              assert image_id.startswith('sha256:') and len(image_id) == 71
              return f"{name}@{image_id}"

          receipt = build_toolchain_provenance(
              lock_bytes=Path('fdm-toolchain.lock.json').read_bytes(),
              manifest_bytes=Path('/tmp/cp5-evidence/toolchain-manifest.json').read_bytes(),
              orca_runtime_bytes=Path('/tmp/cp5-evidence/orca-AppRun').read_bytes(),
              service_commit=os.environ['SOURCE_COMMIT_SHA'],
              runtime_image_ref=local_ref('workpiece-fdm-authority:candidate', '/tmp/cp5-evidence/runtime-image-id.txt'),
              require_published=False,
              candidate_toolchain_image_ref=local_ref('workpiece-fdm-toolchain:candidate', '/tmp/cp5-evidence/toolchain-image-id.txt'),
          )
          assert receipt['authorityState'] == 'evidence_candidate'
          assert receipt['authorityCriticalComplete'] is False
          assert receipt['lockStatus'] == 'unpublished'
          Path('/tmp/cp5-evidence/candidate-provenance.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Start authority service candidate
        run: |
          docker run -d --name workpiece-cp5 -p 8080:8080 \
            -e SOURCE_CODE_URL=https://github.com/workpiece-gr/open-slicer-service \
            -e SOURCE_COMMIT_SHA=${GITHUB_SHA} \
            -e ENABLE_EXPERIMENTAL_PROJECT_API=1 \
            -e WORKPIECE_PROJECT_API_TOKEN=ci-project-token \
            -e PROJECT_QUEUE_TIMEOUT_SECONDS=30 \
            workpiece-fdm-authority:candidate

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/tmp/cp5-evidence/health.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs workpiece-cp5
          exit 1

      - name: Generate small RatRig fixture and exact production 3MF
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          faces = [
              (0,2,1),(0,3,2),(4,5,6),(4,6,7),
              (0,1,5),(0,5,4),(1,2,6),(1,6,5),
              (2,3,7),(2,7,6),(3,0,4),(3,4,7),
          ]
          vertices = [
              (0,0,0),(20,0,0),(20,20,0),(0,20,0),
              (0,0,10),(20,0,10),(20,20,10),(0,20,10),
          ]
          with Path('/tmp/cp5-ratrig.stl').open('wb') as handle:
              handle.write(b'Workpiece CP5 authority runtime fixture'.ljust(80, b'\0'))
              handle.write(struct.pack('<I', len(faces)))
              for face in faces:
                  points = [vertices[index] for index in face]
                  handle.write(struct.pack('<12fH', 0, 0, 1, *points[0], *points[1], *points[2], 0))
          PY

          curl --fail-with-body --max-time 240 \
            -H "Authorization: Bearer ci-project-token" \
            -F file=@/tmp/cp5-ratrig.stl \
            -F material=pla \
            -F quality=balanced \
            -F strength=functional \
            -F quantity=1 \
            -F printer=ratrig_vcore3_300 \
            -F verify=false \
            http://127.0.0.1:8080/v1/project \
            -o /tmp/cp5-project.json

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/cp5-project.json').read_text(encoding='utf-8'))
          assert payload['printer']['key'] == 'ratrig_vcore3_300'
          assert payload['printer']['temporary_generic'] is False
          assert payload['project']['inspection']['instance_count'] == 1
          project = base64.b64decode(payload['project']['base64'], validate=True)
          assert hashlib.sha256(project).hexdigest() == payload['project']['sha256']
          Path('/tmp/cp5-production.3mf').write_bytes(project)
          receipt = {
              'source': {'sha256': payload['source']['sha256']},
              'printer': {
                  'key': payload['printer']['key'],
                  'temporary_generic': payload['printer']['temporary_generic'],
              },
              'profiles': payload['profiles'],
              'engine': payload['engine'],
              'project': {'sha256': payload['project']['sha256']},
          }
          Path('/tmp/cp5-generation-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY

      - name: Reopen exact 3MF through CP2 and validate through CP3
        run: |
          docker cp /tmp/cp5-production.3mf workpiece-cp5:/tmp/cp5-production.3mf
          docker cp /tmp/cp5-generation-receipt.json workpiece-cp5:/tmp/cp5-generation-receipt.json
          docker exec -i workpiece-cp5 python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from app.fdm_exact_gcode import execute_exact_project_gcode
          from app.fdm_profile_driven_gcode import validate_profile_driven_gcode
          from app.main import MATERIALS, build_process_profile

          receipt = json.loads(Path('/tmp/cp5-generation-receipt.json').read_text(encoding='utf-8'))
          exact = execute_exact_project_gcode(
              orca_bin=Path(os.environ['ORCA_BIN']),
              project_path=Path('/tmp/cp5-production.3mf'),
              output_dir=Path('/tmp/cp5-exact-gcode'),
              timeout_seconds=300,
              generation_receipt=receipt,
              base_env=os.environ,
          )
          process_path = Path('/tmp/cp5-process.json')
          build_process_profile(
              Path('/app/profiles/process/pla.json'),
              'balanced',
              'functional',
              process_path,
              str(MATERIALS['pla']['label']),
              automatic_supports=True,
              project_reopen_safe=True,
              single_colour_project=True,
          )
          machine_bytes = Path('/app/profiles/machine.json').read_bytes()
          process_bytes = process_path.read_bytes()
          filament_bytes = Path('/app/profiles/filament/pla.json').read_bytes()
          assert hashlib.sha256(process_bytes).hexdigest() == exact['generation_receipt']['profiles']['process']['sha256']
          validations = []
          for plate in exact['plates']:
              validation = validate_profile_driven_gcode(
                  artifact=plate,
                  generation_receipt=exact['generation_receipt'],
                  machine_profile_bytes=machine_bytes,
                  process_profile_bytes=process_bytes,
                  filament_profile_bytes=filament_bytes,
                  validator_service_commit=os.environ['SOURCE_COMMIT_SHA'],
                  toolchain_ref='cp5-candidate://unpublished-toolchain',
              )
              assert validation['passed'] is True
              assert validation['authorityCriticalComplete'] is True
              validations.append({'plateId': plate['plate_id'], **validation})
          Path('/tmp/cp5-chain-report.json').write_text(
              json.dumps({
                  'authorityState': 'evidence_candidate',
                  'projectSha256': exact['project_sha256'],
                  'plateIds': exact['plate_ids'],
                  'validations': validations,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          docker cp workpiece-cp5:/tmp/cp5-chain-report.json /tmp/cp5-evidence/cp2-cp3-chain-report.json
          docker cp workpiece-cp5:/tmp/cp5-exact-gcode /tmp/cp5-exact-gcode

      - name: Re-hash exact CP5 smoke artifacts on host
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cp5-evidence/cp2-cp3-chain-report.json').read_text(encoding='utf-8'))
          assert report['authorityState'] == 'evidence_candidate'
          assert report['validations']
          for validation in report['validations']:
              assert validation['passed'] is True
              assert validation['authorityCriticalComplete'] is True
              gcode = Path('/tmp/cp5-exact-gcode') / f"plate_{validation['plateId']}.gcode"
              payload = gcode.read_bytes()
              assert payload
              assert hashlib.sha256(payload).hexdigest() == validation['gcodeSha256']
          PY

      - name: Upload CP5 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp5-immutable-toolchain-candidate
          path: |
            /tmp/cp5-evidence/*.json
            /tmp/cp5-evidence/*.txt
            /tmp/cp5-exact-gcode/*.gcode
          if-no-files-found: warn
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: docker logs workpiece-cp5 || true
