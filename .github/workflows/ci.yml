name: Open slicer CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chris/**"
      - "panos/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: PYTHONPATH=. pytest -q

  docker-project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Orca service image
        run: docker build -t workpiece-open-slicer:cp2b .

      - name: Start service
        run: |
          docker run -d --name workpiece-slicer -p 8080:8080 \
            -e SOURCE_CODE_URL=https://github.com/workpiece-gr/open-slicer-service \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            workpiece-open-slicer:cp2b

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs workpiece-slicer
          exit 1

      - name: Generate integration STL
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path

          vertices = [
              (0,0,0),(20,0,0),(20,20,0),(0,20,0),
              (0,0,20),(20,0,20),(20,20,20),(0,20,20),
          ]
          faces = [
              (0,2,1),(0,3,2),(4,5,6),(4,6,7),
              (0,1,5),(0,5,4),(1,2,6),(1,6,5),
              (2,3,7),(2,7,6),(3,0,4),(3,4,7),
          ]
          path = Path("/tmp/workpiece-cube.stl")
          with path.open("wb") as handle:
              handle.write(b"Workpiece CP2b Docker fixture".ljust(80, b"\0"))
              handle.write(struct.pack("<I", len(faces)))
              for face in faces:
                  points = [vertices[index] for index in face]
                  handle.write(struct.pack("<12fH", 0, 0, 1, *points[0], *points[1], *points[2], 0))
          PY

      - name: Build and reopen editable project 3MF
        run: |
          set +e
          curl --fail-with-body --max-time 240 \
            -F file=@/tmp/workpiece-cube.stl \
            -F material=pla \
            -F quality=balanced \
            -F strength=functional \
            -F quantity=3 \
            -F printer=auto \
            http://127.0.0.1:8080/v1/project \
            -o /tmp/project.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/project.json || true
            docker logs workpiece-slicer
            exit "$status"
          fi
          python - <<'PY'
          import base64
          import json
          import zipfile
          from io import BytesIO

          payload = json.load(open("/tmp/project.json", encoding="utf-8"))
          assert payload["experimental"] is True
          assert payload["printer"]["key"] == "ender3_generic_235"
          assert payload["printer"]["temporary_generic"] is True
          assert payload["request"]["quantity"] == 3
          assert payload["request"]["orientation"] == "orca_auto"
          assert payload["request"]["arrangement"] == "orca_auto"
          assert payload["request"]["supports"] == "automatic"
          assert payload["project"]["inspection"]["instance_count"] == 3
          assert payload["project"]["inspection"]["embedded"]["project_settings"] is True
          assert payload["verification"]["reopened_in_fresh_orca_process"] is True
          assert payload["verification"]["plate_count"] >= 1
          project = base64.b64decode(payload["project"]["base64"], validate=True)
          with zipfile.ZipFile(BytesIO(project)) as archive:
              assert "3D/3dmodel.model" in archive.namelist()
              assert "Metadata/project_settings.config" in archive.namelist()
          print(json.dumps({
              "printer": payload["printer"],
              "project_sha256": payload["project"]["sha256"],
              "instances": payload["project"]["inspection"]["instance_count"],
              "plates": payload["verification"]["plate_count"],
              "filament_g": payload["verification"]["total_filament_grams"],
          }, indent=2))
          PY

      - name: Show service logs on failure
        if: failure()
        run: docker logs workpiece-slicer || true
