name: FDM v2 CP2 Orca plate probe

on:
  push:
    branches:
      - chris/fdm-v2-cp2-exact-gcode
  workflow_dispatch:

jobs:
  plate-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Orca service image
        run: docker build -t workpiece-open-slicer:cp2-probe .

      - name: Start service
        run: |
          docker run -d --name workpiece-slicer -p 8080:8080 \
            -e SOURCE_CODE_URL=https://github.com/workpiece-gr/open-slicer-service \
            -e SOURCE_COMMIT_SHA=${GITHUB_SHA} \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e ENABLE_EXPERIMENTAL_PROJECT_API=1 \
            -e WORKPIECE_PROJECT_API_TOKEN=ci-project-token \
            -e PROJECT_QUEUE_TIMEOUT_SECONDS=30 \
            workpiece-open-slicer:cp2-probe

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/tmp/health.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs workpiece-slicer
          exit 1

      - name: Generate forced multi-plate STL
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path

          faces = [
              (0,2,1),(0,3,2),(4,5,6),(4,6,7),
              (0,1,5),(0,5,4),(1,2,6),(1,6,5),
              (2,3,7),(2,7,6),(3,0,4),(3,4,7),
          ]
          vertices = [
              (0,0,0),(80,0,0),(80,80,0),(0,80,0),
              (0,0,20),(80,0,20),(80,80,20),(0,80,20),
          ]
          with Path('/tmp/workpiece-multiplate.stl').open('wb') as handle:
              handle.write(b'Workpiece FDM v2 CP2 plate probe'.ljust(80, b'\0'))
              handle.write(struct.pack('<I', len(faces)))
              for face in faces:
                  points = [vertices[index] for index in face]
                  handle.write(struct.pack('<12fH', 0, 0, 1, *points[0], *points[1], *points[2], 0))
          PY

      - name: Generate exact retained 3MF without legacy verification slice
        run: |
          curl --fail-with-body --max-time 300 \
            -H 'Authorization: Bearer ci-project-token' \
            -F file=@/tmp/workpiece-multiplate.stl \
            -F material=pla \
            -F quality=balanced \
            -F strength=functional \
            -F quantity=12 \
            -F printer=auto \
            -F verify=false \
            -F response_mode=json \
            http://127.0.0.1:8080/v1/project \
            -o /tmp/project.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          payload = json.load(open('/tmp/project.json', encoding='utf-8'))
          assert payload['verification']['performed'] is False
          assert payload['verification']['reopened_in_fresh_orca_process'] is False
          project = base64.b64decode(payload['project']['base64'], validate=True)
          assert hashlib.sha256(project).hexdigest() == payload['project']['sha256']
          assert payload['engine']['service_commit'] and len(payload['engine']['service_commit']) == 40
          Path('/tmp/workpiece-production.3mf').write_bytes(project)
          receipt = {
              'source': {'sha256': payload['source']['sha256']},
              'printer': {
                  'key': payload['printer']['key'],
                  'temporary_generic': payload['printer']['temporary_generic'],
              },
              'profiles': payload['profiles'],
              'engine': payload['engine'],
              'project': {'sha256': payload['project']['sha256']},
          }
          Path('/tmp/generation-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY
          docker cp /tmp/workpiece-production.3mf workpiece-slicer:/tmp/workpiece-production.3mf
          docker cp /tmp/generation-receipt.json workpiece-slicer:/tmp/generation-receipt.json

      - name: Slice exact retained 3MF through CP2 executor
        run: |
          docker exec -i workpiece-slicer python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.fdm_exact_gcode import execute_exact_project_gcode

          receipt = json.loads(Path('/tmp/generation-receipt.json').read_text(encoding='utf-8'))
          result = execute_exact_project_gcode(
              orca_bin=Path(os.environ['ORCA_BIN']),
              project_path=Path('/tmp/workpiece-production.3mf'),
              output_dir=Path('/tmp/cp2-exact-gcode'),
              timeout_seconds=300,
              generation_receipt=receipt,
              base_env=os.environ,
          )
          summary = {
              'performed': result['performed'],
              'authority_state': result['authority_state'],
              'reopened_exact_project': result['reopened_exact_project'],
              'fresh_runtime_state': result['fresh_runtime_state'],
              'project_sha256': result['project_sha256'],
              'plate_ids': result['plate_ids'],
              'generation_receipt': result['generation_receipt'],
              'plates': [
                  {key: value for key, value in plate.items() if key != 'bytes'}
                  for plate in result['plates']
              ],
          }
          Path('/tmp/cp2-result.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          docker cp workpiece-slicer:/tmp/cp2-result.json /tmp/cp2-result.json
          docker cp workpiece-slicer:/tmp/cp2-exact-gcode /tmp/cp2-exact-gcode

      - name: Prove exact 3MF plate ids and retained G-code bytes agree
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          project = json.load(open('/tmp/project.json', encoding='utf-8'))
          result = json.load(open('/tmp/cp2-result.json', encoding='utf-8'))
          assert result['performed'] is True
          assert result['authority_state'] == 'evidence_candidate'
          assert result['reopened_exact_project'] is True
          assert result['fresh_runtime_state'] is True
          assert result['project_sha256'] == project['project']['sha256']
          assert result['generation_receipt']['source']['sha256'] == project['source']['sha256']
          assert result['generation_receipt']['engine']['service_commit'] == project['engine']['service_commit']
          assert result['generation_receipt']['profiles'] == project['profiles']

          project_plates = project['project']['inspection']['plates']
          expected = sorted(int(plate['plater_id']) for plate in project_plates)
          assert len(expected) > 1
          assert all(int(plate['model_instance_count']) > 0 for plate in project_plates)
          assert result['plate_ids'] == expected
          assert [plate['plate_id'] for plate in result['plates']] == expected

          for plate in result['plates']:
              match = re.fullmatch(r'plate_([1-9][0-9]*)\.gcode', plate['filename'])
              assert match and int(match.group(1)) == plate['plate_id']
              retained = Path('/tmp/cp2-exact-gcode') / plate['filename']
              payload = retained.read_bytes()
              assert payload
              assert len(payload) == plate['byte_count']
              assert hashlib.sha256(payload).hexdigest() == plate['sha256']
              assert plate['project_sha256'] == result['project_sha256']
              assert plate['source_sha256'] == project['source']['sha256']
              assert plate['printer_key'] == project['printer']['key']
              assert plate['profile_sha256'] == {
                  kind: project['profiles'][kind]['sha256']
                  for kind in ('machine', 'process', 'filament')
              }
              assert plate['orca_version'] == project['engine']['version']
              assert plate['service_commit'] == project['engine']['service_commit']
          PY

      - name: Show service logs on failure
        if: failure()
        run: docker logs workpiece-slicer || true
